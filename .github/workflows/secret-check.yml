name: Secret pattern check

on:
  pull_request: {}
  push: {}

jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic secret grep
        run: |
          set -e
          echo "Searching for likely secret patterns..."
          # Only flags KEY=/KEY: assignments with a real quoted value (8+ chars),
          # not bare mentions of the word (e.g. os.getenv("DISCORD_TOKEN")) or
          # empty .env.example placeholders. Docs and this workflow are excluded
          # since they legitimately reference these variable names.
          if git grep -I --line-number -E "(TOKEN|SECRET|API_KEY|PASSWORD|PRIVATE_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY)[[:space:]]*[:=][[:space:]]*[\"'][A-Za-z0-9_/+.-]{8,}[\"']" -- . ':!*.md' ':!.env.example' ':!.github/workflows/*'; then
            echo ""
            echo "Potential secret detected. Please remove secrets from commits or use placeholders (e.g., .env, secrets manager)."
            exit 1
          else
            echo "No obvious secrets detected."
          fi

name: Secret pattern check

on:
  pull_request: {}
  push: {}

jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic secret grep
        run: |
          set -e
          echo "Searching for likely secret patterns..."
          # Simple, conservative patterns. This will catch obvious accidental commits.
          if git grep -I --line-number -E 'TOKEN|SECRET|API_KEY|PASSWORD|PRIVATE_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY' ; then
            echo ""
            echo "Potential secret detected. Please remove secrets from commits or use placeholders (e.g., .env, secrets manager)."
            exit 1
          else
            echo "No obvious secrets detected."
          fi